name: Migration automatique i18n

on:
  workflow_dispatch:
    inputs:
      category:
        description: Catégorie à migrer et traduire
        required: true
        default: lib
        type: choice
        options:
          - lib
          - component
          - pdf
          - app

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Générer l’audit et les dictionnaires
        run: npm run i18n:prepare

      - name: Migrer automatiquement la catégorie
        run: npm run i18n:migrate:write -- --category=${{ inputs.category }}

      - name: Réparer les anciens imports i18n
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path("app"),
              Path("components"),
              Path("lib"),
          ]

          extensions = {
              ".ts",
              ".tsx",
              ".js",
              ".jsx",
          }

          pattern = re.compile(
              r'''(
                  import
                  \s+
                  __i18n
                  \s+
                  from
                  \s+
                  ["']
              )
              (
                  [^"']*i18n/migrated/[^"']+
              )
              (
                  ["']
                  ;?
              )''',
              re.VERBOSE,
          )

          repaired_count = [0]

          def repair_import(match: re.Match[str]) -> str:
              import_path = match.group(2)

              if import_path.endswith(".json"):
                  return match.group(0)

              repaired_count[0] += 1

              return (
                  match.group(1)
                  + import_path
                  + ".json"
                  + match.group(3)
              )

          for root in roots:
              if not root.exists():
                  continue

              for file_path in root.rglob("*"):
                  if (
                      not file_path.is_file()
                      or file_path.suffix not in extensions
                  ):
                      continue

                  original = file_path.read_text(
                      encoding="utf-8",
                  )

                  corrected = pattern.sub(
                      repair_import,
                      original,
                  )

                  if corrected == original:
                      continue

                  file_path.write_text(
                      corrected,
                      encoding="utf-8",
                  )

                  print(
                      f"Import réparé : {file_path}"
                  )

          print(
              f"Nombre d’imports réparés : "
              f"{repaired_count[0]}"
          )
          PY

      - name: Traduire automatiquement les dictionnaires
        run: npm run i18n:translate -- --category=${{ inputs.category }}

      - name: Supprimer les sauvegardes temporaires
        run: |
          rm -rf .i18n-backup
          rm -rf i18n-backup

      - name: Enregistrer les changements dans GitHub
        run: |
          git config user.name "Luna Astralis i18n"
          git config user.email "actions@github.com"

          git add app components lib i18n scripts package.json

          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
          else
            git commit -m "Migrate and translate i18n: ${{ inputs.category }}"
            git push
          fi

      - name: Vérifier la compilation
        run: npx next build
