name: Migration automatique i18n

on:
  workflow_dispatch:
    inputs:
      category:
        description: Catégorie à migrer et traduire
        required: true
        default: lib
        type: choice
        options:
          - lib
          - component
          - pdf
          - app

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Générer l’audit et les dictionnaires
        run: npm run i18n:prepare

      - name: Migrer automatiquement la catégorie
        run: npm run i18n:migrate:write -- --category=${{ inputs.category }}

      - name: Réparer les imports i18n
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path("app"),
              Path("components"),
              Path("lib"),
          ]

          extensions = {
              ".ts",
              ".tsx",
              ".js",
              ".jsx",
          }

          import_pattern = re.compile(
              r'import\s+__i18n\s+from\s+["\']([^"\']+)["\'];?\s*'
          )

          directive_pattern = re.compile(
              r'^('
              r'(?:(?:\s+)'
              r'|(?:\/\/[^\n]*(?:\n|$))'
              r'|(?:\/\*[\s\S]*?\*\/))*'
              r')'
              r'(["\'])use (client|server)\2;\s*'
          )

          repaired_count = 0

          for root in roots:
              if not root.exists():
                  continue

              for file_path in root.rglob("*"):
                  if (
                      not file_path.is_file()
                      or file_path.suffix not in extensions
                  ):
                      continue

                  source = file_path.read_text(
                      encoding="utf-8",
                  )

                  import_match = import_pattern.search(
                      source,
                  )

                  if not import_match:
                      continue

                  import_path = import_match.group(1)

                  if not import_path.endswith(".json"):
                      import_path += ".json"

                  import_line = (
                      f'import __i18n from "{import_path}";\n'
                  )

                  source_without_import = import_pattern.sub(
                      "",
                      source,
                      count=1,
                  )

                  directive_match = directive_pattern.match(
                      source_without_import,
                  )

                  if directive_match:
                      position = directive_match.end()

                      corrected = (
                          source_without_import[:position]
                          + "\n"
                          + import_line
                          + source_without_import[position:]
                      )
                  else:
                      corrected = (
                          import_line
                          + source_without_import
                      )

                  if corrected == source:
                      continue

                  file_path.write_text(
                      corrected,
                      encoding="utf-8",
                  )

                  repaired_count += 1

                  print(
                      f"Import réparé : {file_path}"
                  )

          print(
              f"Nombre de fichiers réparés : "
              f"{repaired_count}"
          )
          PY

      - name: Restaurer les blocs styled-jsx
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          roots = [
              Path("app"),
              Path("components"),
              Path("lib"),
          ]

          extensions = {
              ".tsx",
              ".jsx",
              ".ts",
              ".js",
          }

          import_pattern = re.compile(
              r'import\s+__i18n\s+from\s+'
              r'["\']([^"\']+\.json)["\'];?'
          )

          style_pattern = re.compile(
              r'<style'
              r'(?P<attributes>\s+[^>]*)?'
              r'>\s*'
              r'\{\s*__i18n'
              r'\[\s*["\']'
              r'(?P<key>[^"\']+)'
              r'["\']\s*\]'
              r'\s*\}\s*'
              r'</style>',
              re.DOTALL,
          )

          repaired_files = 0
          repaired_blocks = [0]
          warnings = []

          def escape_template_literal(
              value: str,
          ) -> str:
              return (
                  value
                  .replace("\\", "\\\\")
                  .replace("`", "\\`")
                  .replace("${", "\\${")
              )

          for root in roots:
              if not root.exists():
                  continue

              for source_file in root.rglob("*"):
                  if (
                      not source_file.is_file()
                      or source_file.suffix not in extensions
                  ):
                      continue

                  source = source_file.read_text(
                      encoding="utf-8",
                  )

                  if "<style" not in source:
                      continue

                  dictionary_match = (
                      import_pattern.search(source)
                  )

                  if not dictionary_match:
                      continue

                  dictionary_import = (
                      dictionary_match.group(1)
                  )

                  dictionary_file = (
                      source_file.parent
                      / dictionary_import
                  ).resolve()

                  if not dictionary_file.exists():
                      warnings.append(
                          "Dictionnaire introuvable : "
                          f"{dictionary_file}"
                      )
                      continue

                  try:
                      dictionary = json.loads(
                          dictionary_file.read_text(
                              encoding="utf-8",
                          )
                      )
                  except Exception as error:
                      warnings.append(
                          "JSON invalide dans "
                          f"{dictionary_file} : "
                          f"{error}"
                      )
                      continue

                  file_repairs = [0]

                  def restore_style(
                      match: re.Match[str],
                  ) -> str:
                      key = match.group("key")
                      css = dictionary.get(key)

                      if not isinstance(css, str):
                          warnings.append(
                              f"Clé CSS absente : "
                              f"{dictionary_file} — "
                              f"{key}"
                          )
                          return match.group(0)

                      attributes = (
                          match.group("attributes")
                          or ""
                      )

                      safe_css = (
                          escape_template_literal(css)
                      )

                      file_repairs[0] += 1
                      repaired_blocks[0] += 1

                      return (
                          f"<style{attributes}>"
                          f"{{`\n"
                          f"{safe_css}\n"
                          f"`}}"
                          f"</style>"
                      )

                  corrected = style_pattern.sub(
                      restore_style,
                      source,
                  )

                  if corrected == source:
                      continue

                  source_file.write_text(
                      corrected,
                      encoding="utf-8",
                  )

                  repaired_files += 1

                  print(
                      "Styled JSX réparé : "
                      f"{source_file} "
                      f"({file_repairs[0]} bloc(s))"
                  )

          print("")
          print(
              "Fichiers styled-jsx réparés : "
              f"{repaired_files}"
          )
          print(
              "Blocs styled-jsx réparés : "
              f"{repaired_blocks[0]}"
          )

          if warnings:
              print("")
              print("Avertissements :")

              for warning in warnings:
                  print(f"- {warning}")
          PY

      - name: Traduire automatiquement les dictionnaires
        run: npm run i18n:translate -- --category=${{ inputs.category }}

      - name: Supprimer les sauvegardes temporaires
        run: |
          rm -rf .i18n-backup
          rm -rf i18n-backup

      - name: Enregistrer les changements dans GitHub
        run: |
          git config user.name "Luna Astralis i18n"
          git config user.email "actions@github.com"

          git add app components lib i18n scripts package.json

          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
          else
            git commit -m "Migrate and translate i18n: ${{ inputs.category }}"
            git push
          fi
